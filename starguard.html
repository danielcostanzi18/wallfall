<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starguard</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #05050b; overflow: hidden; }
  canvas { display: block; }
  video { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<video id="video" playsinline muted></video>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ---------------------------------------------------------------------------
// Starguard: a co-op space shooter for 1-2 players, played with your whole body.
//   Step / lean left-right  -> fly        (your position in the room is the ship's position)
//   Arms out wide (T-pose)  -> spread shot while held (uses energy)
//   Squat                   -> shield (no shooting while shielded)
//   Both hands above head   -> hold: NOVA bomb (clears the screen) / start / join / resume
// The ship fires on its own. It gets faster and busier over 4 minutes; a Warden boss comes every 80 s.
// Gesture distances are in shoulder widths, so they work at any distance from the camera.
// ---------------------------------------------------------------------------
const C = {
  trackMin: 0.2, trackMax: 0.8, // this band of the camera view (0..1, left..right) spans the whole screen
  follow: 14,           // how quickly the ship follows you (1/s)
  maxShipSpeed: 170,    // field units per second (field is 100 units tall)
  keySpeed: 85,
  overheadOn: 0.35,     // both wrists this far above the shoulders -> "hands up"
  wideOn: 1.35, wideOff: 1.05, // each wrist this far out sideways from the body centre -> arms wide
  wideMaxRise: 0.9,     // ...and roughly at shoulder height (within this)
  squatOn: 0.55, squatOff: 0.30, // shoulders this far below standing height -> squat
  calibFrames: 15,      // standing height = median of this many frames (hands below shoulders)
  refForgetMs: 1500,
  confirmFrames: 2,     // a pose must hold this many camera frames to count
  bombHoldMs: 350, startHoldMs: 700,
  shieldMaxMs: 2500, shieldCooldownMs: 1200,
  lives: 3, maxLives: 5, startBombs: 1, maxBombs: 3, bombEvery: 5000, invulnMs: 2200,
  fireMs: 170, spreadDrain: 30, spreadRecharge: 14,
  rampMs: 240000,       // difficulty ramps up over this much play time (pauses don't count)
  spawnStart: 1.5, spawnEnd: 0.42, // seconds between enemies at the start / at full ramp
  bossEvery: 80000, dropChance: 0.05,
  lostPauseMs: 2500, maxFps: 30, musicVolume: 0.8,
};
const WASM_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const PCOLORS = ['#ff5fa2', '#5ce1e6'];
const SHIP_Y = 88;

const $ = s => document.querySelector(s);
const cv = $('#game'), ctx = cv.getContext('2d'), video = $('#video');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

// ---------------------------------------------------------------------------
// Logging: browser console + the terminal running serve.py (POST /log).
// ---------------------------------------------------------------------------
let termOK = true, termQueue = [], termTimer = null;
function errStr(e) {
  if (e == null) return String(e);
  if (typeof e === 'string') return e;
  if (typeof Event !== 'undefined' && e instanceof Event) return `Event(${e.type}) from ${e.target?.src || e.target?.tagName || '?'}`;
  return `${e.name || 'Error'}: ${e.message || String(e)}`;
}
function log(msg, level = 'info') {
  const line = `${(performance.now() / 1000).toFixed(1).padStart(6)}s [starguard] ${level === 'info' ? '' : level.toUpperCase() + ' '}${msg}`;
  (console[level === 'error' ? 'error' : level === 'warn' ? 'warn' : 'log'])(line);
  if (!termOK) return;
  termQueue.push(line);
  termTimer ??= setTimeout(flushTerm, 150);
}
function flushTerm() {
  termTimer = null;
  if (!termQueue.length) return;
  const body = termQueue.join('\n'); termQueue = [];
  fetch('/log', { method: 'POST', body, keepalive: true, headers: { 'Content-Type': 'text/plain' } })
    .then(r => { if (!r.ok) termOK = false; }).catch(() => { termOK = false; });
}
addEventListener('error', e => log('Uncaught: ' + errStr(e.error || e.message), 'error'));
addEventListener('unhandledrejection', e => log('Unhandled promise: ' + errStr(e.reason), 'error'));

// ---------------------------------------------------------------------------
// Sound: synth effects + an original chiptune loop (tempo follows the difficulty).
// ---------------------------------------------------------------------------
let actx = null, musicGain = null, sfxGain = null, noiseBuf = null, musicOn = true;
function unlockAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      actx.addEventListener('statechange', () => log(`Sound: ${actx.state}`));
      musicGain = actx.createGain(); musicGain.gain.value = C.musicVolume * 0.5; musicGain.connect(actx.destination);
      sfxGain = actx.createGain(); sfxGain.gain.value = 0.8; sfxGain.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
const soundOn = () => actx && actx.state === 'running';
function tone(f0, f1, d, type = 'square', vol = 0.05) {
  if (!soundOn()) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(sfxGain); o.start(t); o.stop(t + d + 0.02);
}
function boom(d = 0.3, vol = 0.15, cutoff = 1600) {
  if (!soundOn()) return;
  const t = actx.currentTime, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t); f.frequency.exponentialRampToValueAtTime(80, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f).connect(g).connect(sfxGain); s.start(t); s.stop(t + d + 0.02);
}
function mnote(midi, t, dur, type, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(musicGain); o.start(t); o.stop(t + dur + 0.02);
}
// Original loop: Am - F - C - G, pumping octave bass, chord arpeggio, and a lead on every second pass.
const CHORDS = [[45, [57, 60, 64]], [41, [57, 60, 65]], [48, [55, 60, 64]], [43, [55, 59, 62]]];
const LEAD = [76, 0, 74, 72, 0, 72, 74, 76,  77, 0, 76, 74, 0, 72, 69, 0,
              72, 0, 74, 76, 0, 79, 76, 0,   74, 0, 72, 71, 0, 74, 79, 0];
const music = { step: 0, next: 0, playing: false };
function musicTick() {
  if (!soundOn()) return;
  musicGain.gain.value = C.musicVolume * 0.5;
  if (!musicOn || S.state !== 'playing') { music.playing = false; return; }
  if (!music.playing) { music.playing = true; music.next = actx.currentTime + 0.05; }
  const eighth = 60 / (118 + 44 * intensity()) / 2;
  while (music.next < actx.currentTime + 0.15) {
    const st = music.step, i = st & 7, [root, tri] = CHORDS[(st >> 3) & 3], t = music.next;
    mnote(i % 2 ? root + 12 : root, t, eighth * 0.9, 'triangle', 0.22);
    mnote(tri[[0, 1, 2, 1][i & 3]], t, eighth * 0.5, 'square', 0.03);
    if (st >= 32 && LEAD[st - 32]) mnote(LEAD[st - 32], t, eighth * 1.6, 'square', 0.055);
    music.next += eighth; music.step = (st + 1) % 64;
  }
}

// ---------------------------------------------------------------------------
// Players (2 slots) and body tracking
// ---------------------------------------------------------------------------
let landmarker = null, poseReady = false, lastVideoTime = -1, detectErrors = 0, swapLR = false;
let showCam = true, debug = false;
const vx = x => (swapLR ? x : 1 - x);   // mirror: step to your right -> ship goes right on the wall
function makeSlot(i) {
  return {
    i, name: 'P' + (i + 1), color: PCOLORS[i], lm: null, f: null, seen: false, lastSeen: -1e9, ptx: i ? 0.75 : 0.25, tx: null,
    ref: null, calib: [], tallN: 0, sq: { on: false, n: 0 }, wide: { on: false, n: 0 }, up: { on: false, n: 0 },
    upStart: null, upUsed: false, holdFrac: 0,
    keys: { l: false, r: false, spread: false, shield: false }, keyT: -1e9,
    joined: false, lives: 0, score: 0, bombs: 0, nextBombAt: C.bombEvery, x: 50, invuln: 0, fireAcc: 0,
    energy: 100, spreadLock: false, spreading: false, shield: false, shieldMs: 0, shieldCd: 0, shieldBlocked: false,
  };
}
const slots = [makeSlot(0), makeSlot(1)];
const alive = p => p.joined && p.lives > 0;

function updSw(s, onCond, offCond) {
  if (!s.on) { if (onCond) { if (++s.n >= C.confirmFrames) { s.on = true; s.n = 0; return 'rise'; } } else s.n = 0; }
  else { if (offCond) { if (++s.n >= C.confirmFrames) { s.on = false; s.n = 0; return 'fall'; } } else s.n = 0; }
  return null;
}
function resetRef(p) { p.ref = null; p.calib = []; p.tallN = 0; p.sq = { on: false, n: 0 }; }

async function initCamera() {
  log(`Page ${location.href}`);
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    camMsg = `Camera blocked: open http://localhost:${location.port || 8000} instead`; log(camMsg, 'error'); return;
  }
  try {
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 }, facingMode: 'user' }, audio: false }); }
    catch (e) { log('Camera: preferred settings failed (' + errStr(e) + '), retrying', 'warn'); stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); }
    video.srcObject = stream;
    const meta = new Promise(res => video.readyState >= 1 ? res() : video.addEventListener('loadedmetadata', res, { once: true }));
    video.play().catch(e => log('video.play(): ' + errStr(e), 'warn'));
    await meta;
    log(`Camera: ${video.videoWidth}x${video.videoHeight} "${stream.getVideoTracks()[0]?.label || '?'}"`);
    camMsg = 'Loading body tracking…';
  } catch (e) {
    camMsg = `Camera unavailable (${e.name}). Keyboard still works.`; log('Camera failed: ' + errStr(e), 'error'); return;
  }
  try {
    const fileset = await FilesetResolver.forVisionTasks(WASM_BASE);
    for (const delegate of ['GPU', 'CPU']) {
      try {
        const t0 = performance.now();
        landmarker = await PoseLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: MODEL_URL, delegate }, runningMode: 'VIDEO', numPoses: 2,
          minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5,
        });
        log(`Model: loaded with ${delegate} in ${Math.round(performance.now() - t0)} ms`); break;
      } catch (e) { log(`Model: ${delegate} failed: ${errStr(e)}`, delegate === 'GPU' ? 'warn' : 'error'); if (delegate === 'CPU') throw e; }
    }
    poseReady = true; camMsg = '';
  } catch (e) { camMsg = 'Body tracking failed (see terminal). Keyboard still works.'; log('Model: ' + errStr(e), 'error'); }
}
let camMsg = 'Starting camera…';

// The model sometimes reports one person twice, or a half-visible ghost: keep detections with
// both shoulders visible and merge ones that sit on top of each other.
function cleanDetections(list) {
  const W = video.videoWidth || 640, H = video.videoHeight || 480, out = [];
  for (const lm of list) {
    const a = lm[11], b = lm[12];
    if ((a.visibility ?? 1) < 0.5 || (b.visibility ?? 1) < 0.5) continue;
    const d = { lm, x: (a.x + b.x) / 2 * W, y: (a.y + b.y) / 2 * H, sw: Math.hypot((a.x - b.x) * W, (a.y - b.y) * H) };
    const dup = out.find(o => Math.hypot(o.x - d.x, o.y - d.y) < 0.6 * Math.max(o.sw, d.sw));
    if (dup) { if (d.sw > dup.sw) Object.assign(dup, d); continue; }
    out.push(d);
  }
  return out.map(d => d.lm);
}
// Who is who: when exactly one player is flying, that ship follows the person nearest to it
// (so someone walking in can't take it over); otherwise the left person is P1.
function assign(list) {
  const dets = list.map(lm => ({ lm, x: vx((lm[11].x + lm[12].x) / 2) })).sort((a, b) => a.x - b.x);
  const out = [null, null], playing = S.state === 'playing' || S.state === 'paused';
  const live = playing ? slots.filter(alive) : [];
  const near = (p, ds) => ds.reduce((a, b) => Math.abs(a.x - p.ptx) <= Math.abs(b.x - p.ptx) ? a : b);
  if (dets.length >= 2) {
    const two = [dets[0], dets[dets.length - 1]];
    if (live.length === 1) { const me = near(live[0], two); out[live[0].i] = me.lm; out[1 - live[0].i] = two.find(d => d !== me).lm; }
    else { out[0] = two[0].lm; out[1] = two[1].lm; }
  } else if (dets.length === 1) {
    const target = live.length === 1 ? live[0] : live.length === 2 ? live.reduce((a, b) => Math.abs(a.ptx - dets[0].x) <= Math.abs(b.ptx - dets[0].x) ? a : b) : slots[0];
    out[target.i] = dets[0].lm;
  }
  return out;
}
function pollPose(now) {
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  let res;
  try { res = landmarker.detectForVideo(video, now); } catch (e) { if (detectErrors++ < 5) log('detectForVideo failed: ' + errStr(e), 'error'); return; }
  const a = assign(cleanDetections(res.landmarks || []));
  slots.forEach((p, i) => processPose(p, a[i], now));
}
function processPose(p, lm, now) {
  p.lm = lm || null;
  if (!lm) {
    if (p.seen) { p.seen = false; log(`${p.name}: out of view`); }
    p.f = null; p.wide = { on: false, n: 0 }; p.up = { on: false, n: 0 }; p.sq = { on: false, n: 0 };
    if (p.ref != null && now - p.lastSeen > C.refForgetMs) resetRef(p);
    return;
  }
  if (!p.seen) { p.seen = true; log(`${p.name}: in view`); }
  p.lastSeen = now;
  const W = video.videoWidth || 640, H = video.videoHeight || 480;
  const P = i => ({ x: vx(lm[i].x) * W, y: lm[i].y * H, v: lm[i].visibility ?? 1 });
  const s1 = P(11), s2 = P(12), w1 = P(15), w2 = P(16);
  const sw = Math.max(8, Math.hypot(s1.x - s2.x, s1.y - s2.y)), cx = (s1.x + s2.x) / 2, shY = (s1.y + s2.y) / 2;
  p.ptx = cx / W;
  p.tx = clamp((p.ptx - C.trackMin) / (C.trackMax - C.trackMin), 0, 1);
  const hands = w1.v > 0.5 && w2.v > 0.5;
  const [hL, hR] = w1.x <= w2.x ? [w1, w2] : [w2, w1];
  const lx = (cx - hL.x) / sw, rx = (hR.x - cx) / sw;
  const up = hands && (shY - hL.y) / sw > C.overheadOn && (shY - hR.y) / sw > C.overheadOn;
  const atShoulder = Math.abs(hL.y - shY) / sw < C.wideMaxRise && Math.abs(hR.y - shY) / sw < C.wideMaxRise;
  const eW = updSw(p.wide, hands && !up && lx > C.wideOn && rx > C.wideOn && atShoulder, !hands || up || lx < C.wideOff || rx < C.wideOff);
  updSw(p.up, up, !up);

  // Squat: shoulders below the standing height measured at the start of the game (fixed, not adaptive).
  const handsRaised = hands && (hL.y < shY || hR.y < shY);
  if (p.ref == null) {
    if (!handsRaised) p.calib.push(shY);
    if (p.calib.length >= C.calibFrames) { const c = p.calib.slice().sort((a, b) => a - b); p.ref = c[c.length >> 1]; p.calib = []; log(`${p.name}: standing height set`); }
  }
  const drop = p.ref == null ? 0 : (shY - p.ref) / sw;
  const eS = updSw(p.sq, p.ref != null && drop > C.squatOn, p.ref == null || drop < C.squatOff);
  if (p.ref != null && !handsRaised && drop < -C.squatOff) {   // standing clearly taller for a while: measure again
    if (++p.tallN > C.calibFrames * 3) resetRef(p);
  } else p.tallN = 0;
  if (debug && eW) log(`${p.name}: arms wide ${eW} (${lx.toFixed(2)}, ${rx.toFixed(2)})`);
  if (debug && eS) log(`${p.name}: squat ${eS} (${drop.toFixed(2)})`);
  p.f = { hands, lx, rx, up, drop, hLi: w1.x <= w2.x ? 15 : 16, hRi: w1.x <= w2.x ? 16 : 15 };
}

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
let FW = 160;   // field width in units (height is always 100)
let best = 0;
try { best = +localStorage.getItem('starguard-best') || 0; } catch (e) {}
const S = {
  state: 'title', t: 0, enemies: [], pb: [], eb: [], pickups: [], parts: [], rings: [], texts: [],
  spawnAcc: 0, nextBoss: C.bossEvery, boss: null, bossN: 0, flash: 0, shake: 0, lostMs: 0, overAt: 0, minute: 0,
  stars: Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random() * 100, z: Math.random() })),
};
const intensity = () => Math.min(1, S.t / C.rampMs);
const speedMul = () => 1 + 0.75 * Math.min(1.3, S.t / C.rampMs);
const teamScore = () => slots.reduce((a, p) => a + (p.joined ? p.score : 0), 0);

function initShip(p) {
  Object.assign(p, { joined: true, lives: C.lives, score: 0, bombs: C.startBombs, nextBombAt: C.bombEvery, invuln: C.invulnMs,
    fireAcc: 0, energy: 100, spreadLock: false, spreading: false, shield: false, shieldMs: 0, shieldCd: 0, shieldBlocked: false });
  p.x = p.tx != null && now() - p.keyT > 1500 ? 6 + p.tx * (FW - 12) : FW * (p.i ? 0.7 : 0.3);
  resetRef(p);
}
const now = () => performance.now();
function startGame(by) {
  Object.assign(S, { state: 'playing', t: 0, enemies: [], pb: [], eb: [], pickups: [], rings: [], texts: [], spawnAcc: 0,
    nextBoss: C.bossEvery, boss: null, bossN: 0, flash: 0.6, lostMs: 0, minute: 0 });
  for (const p of slots) {
    p.joined = false;
    if (p === by || p.lm || now() - p.keyT < 1500) initShip(p);
  }
  music.step = 0; consumeHandsUp();
  tone(330, 990, 0.35, 'square', 0.06);
  log(`Game started: ${slots.filter(p => p.joined).map(p => p.name).join(' + ')}`);
}
// Hands already up when the game starts / resumes / someone joins must come down before they count again
// (otherwise a second player's half-finished hold would fire a NOVA straight away).
function consumeHandsUp() { for (const q of slots) if (q.up.on) q.upUsed = true; }
function join(p) {
  initShip(p); consumeHandsUp(); S.texts.push({ x: p.x, y: SHIP_Y - 8, text: p.name + ' JOINED', color: p.color, t: 0, big: true });
  tone(440, 880, 0.25, 'square', 0.06); log(`${p.name}: joined`);
}
function pause(why) { if (S.state !== 'playing') return; S.state = 'paused'; log(`Paused${why ? ' (' + why + ')' : ''}`); }
function resume() { if (S.state !== 'paused') return; S.state = 'playing'; S.lostMs = 0; consumeHandsUp(); for (const p of slots) if (alive(p)) p.invuln = Math.max(p.invuln, 1200); log('Resumed'); }
function gameOver() {
  S.state = 'over'; S.overAt = now();
  const team = teamScore();
  if (team > best) { best = team; try { localStorage.setItem('starguard-best', best); } catch (e) {} }
  boom(1.4, 0.3, 500);
  log(`Game over after ${(S.t / 1000).toFixed(0)} s: ${slots.filter(p => p.joined).map(p => `${p.name} ${p.score}`).join(', ')} (team ${team}, best ${best})`);
}

// --- enemies -----------------------------------------------------------------
const ETYPES = {
  drifter:  { r: 3,  hp: 1, pts: 100, color: '#ffd84d' },
  darter:   { r: 3,  hp: 1, pts: 150, color: '#ff8a3d' },
  gunner:   { r: 4,  hp: 3, pts: 300, color: '#a77bff' },
  splitter: { r: 6,  hp: 4, pts: 250, color: '#6bff8f' },
  boss:     { r: 13, hp: 80, pts: 3000, color: '#ff5f7a' },
};
function makeEnemy(type, x, y, extra = {}) {
  const T = ETYPES[type];
  return { type, x, y, x0: x, r: T.r, hp: T.hp, maxHp: T.hp, pts: T.pts, color: T.color, t: 0, ph: rnd(0, 6.3), amp: rnd(4, 12),
    state: 'enter', stopY: rnd(10, 30), vx: 0, vy: 0, dir: Math.random() < 0.5 ? -1 : 1, fireAcc: rnd(0, 1), flash: 0, ...extra };
}
function spawnEnemy(k) {
  const w = [['drifter', 1], ['darter', 0.2 + 0.8 * k], ['gunner', 0.1 + 0.6 * k], ['splitter', 0.05 + 0.5 * k]];
  let r = Math.random() * w.reduce((a, x) => a + x[1], 0), type = 'drifter';
  for (const [t, v] of w) { if ((r -= v) < 0) { type = t; break; } }
  S.enemies.push(makeEnemy(type, rnd(10, FW - 10), -8, type === 'gunner' ? { stopY: rnd(8, 22) } : {}));
}
function spawnBoss() {
  const n = slots.filter(alive).length;
  const hp = Math.round((80 + 40 * S.bossN) * (1 + 0.6 * Math.max(0, n - 1)));
  S.boss = makeEnemy('boss', FW / 2, -18, { hp, maxHp: hp, pts: 3000 + 1000 * S.bossN, fanAcc: 0, aimAcc: 0 });
  S.enemies.push(S.boss);
  S.texts.push({ x: FW / 2, y: 45, text: 'WARDEN INCOMING', color: '#ff5f7a', t: 0, big: true });
  tone(110, 55, 1.2, 'sawtooth', 0.08);
  log(`Boss ${S.bossN + 1} (hp ${hp})`);
}
function nearestShip(x) {
  let best = null;
  for (const p of slots) if (alive(p) && (!best || Math.abs(p.x - x) < Math.abs(best.x - x))) best = p;
  return best;
}
function shootAt(e, p, speed, spreadDeg = 0) {
  const tx = p ? p.x : e.x, a = Math.atan2(SHIP_Y - e.y, tx - e.x) + spreadDeg * Math.PI / 180;
  S.eb.push({ x: e.x, y: e.y + e.r * 0.6, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 1.2 });
}
function updateEnemy(e, ds, spd) {
  e.t += ds; e.flash = Math.max(0, e.flash - ds);
  switch (e.type) {
    case 'drifter':
      e.y += 11 * spd * ds; e.x = e.x0 + Math.sin(e.t * 1.6 + e.ph) * e.amp; break;
    case 'splitter':
      e.y += 7 * spd * ds; e.x = e.x0 + Math.sin(e.t * 0.9 + e.ph) * 5; break;
    case 'darter':
      if (e.state === 'enter') { e.y += 30 * ds; if (e.y >= e.stopY) { e.state = 'aim'; e.t = 0; } }
      else if (e.state === 'aim') {
        if (e.t > 0.75) {
          const p = nearestShip(e.x), tx = p ? p.x : e.x, a = Math.atan2(SHIP_Y - e.y, tx - e.x), v = 58 * spd;
          e.vx = Math.cos(a) * v; e.vy = Math.sin(a) * v; e.state = 'dive'; tone(900, 300, 0.15, 'sawtooth', 0.02);
        }
      } else { e.x += e.vx * ds; e.y += e.vy * ds; }
      break;
    case 'gunner':
      if (e.state === 'enter') { e.y += 20 * ds; if (e.y >= e.stopY) { e.state = 'strafe'; e.t = 0; } }
      else if (e.state === 'strafe') {
        e.x += e.dir * 12 * spd * ds; if (e.x < 8 || e.x > FW - 8) e.dir *= -1;
        e.fireAcc += ds; if (e.fireAcc > 1.7 / spd) { e.fireAcc = 0; shootAt(e, nearestShip(e.x), 32 * spd); }
        if (e.t > 14) e.state = 'leave';
      } else e.y -= 20 * ds;
      break;
    case 'boss': {
      if (e.state === 'enter') { e.y += 12 * ds; if (e.y >= 25) { e.state = 'fight'; e.t = 0; } break; }
      e.x = FW / 2 + Math.sin(e.t * 0.5) * (FW / 2 - 22);
      e.fanAcc += ds; e.aimAcc += ds;
      if (e.fanAcc > 2.4 / spd) { e.fanAcc = 0; for (let k = -4; k <= 4; k++) { const a = Math.PI / 2 + k * 0.2; S.eb.push({ x: e.x, y: e.y + 8, vx: Math.cos(a) * 24, vy: Math.sin(a) * 24, r: 1.4 }); } tone(200, 120, 0.2, 'square', 0.03); }
      if (e.aimAcc > 1.2 / spd) { e.aimAcc = 0; const targets = slots.filter(alive), p = targets[Math.floor(Math.random() * targets.length)]; for (const d of [-8, 0, 8]) shootAt(e, p, 36, d); }
      break;
    }
  }
}
function damage(e, n, owner) {
  if (e.dead) return;
  e.hp -= n; e.flash = 0.08;
  if (e.hp <= 0) kill(e, owner);
  else if (e.type === 'boss') tone(160, 140, 0.04, 'square', 0.02);
}
function kill(e, owner) {
  e.dead = true;
  const boss = e.type === 'boss';
  explode(e.x, e.y, e.color, boss ? 140 : 14 + e.r * 3, boss ? 50 : 30);
  boom(boss ? 1.4 : 0.25, boss ? 0.45 : 0.12, boss ? 700 : 1800);
  if (owner) { addScore(owner, e.pts); S.texts.push({ x: e.x, y: e.y, text: String(e.pts), color: owner.color, t: 0 }); }
  if (e.type === 'splitter') for (const s of [-1, 1]) S.enemies.push(makeEnemy('drifter', e.x + s * 3, e.y, { amp: 6, ph: s > 0 ? 0 : 3.1, pts: 50 }));
  if (boss) {
    S.boss = null; S.bossN++; S.nextBoss = S.t + C.bossEvery; S.flash = 1; S.shake = 1.5;
    for (const p of slots) if (alive(p) && p.bombs < C.maxBombs) p.bombs++;
    S.texts.push({ x: FW / 2, y: 45, text: 'WARDEN DOWN  +NOVA', color: '#ffd84d', t: 0, big: true });
    log(`Boss ${S.bossN} destroyed${owner ? ' by ' + owner.name : ''}`);
  } else if (Math.random() < C.dropChance) S.pickups.push({ x: e.x, y: e.y, kind: Math.random() < 0.25 ? 'life' : 'bomb', t: 0 });
}
function addScore(p, n) {
  p.score += n;
  while (p.score >= p.nextBombAt) {
    p.nextBombAt += C.bombEvery;
    if (p.bombs < C.maxBombs) { p.bombs++; S.texts.push({ x: p.x, y: SHIP_Y - 8, text: '+NOVA', color: '#ffd84d', t: 0 }); }
  }
}

// --- ships -------------------------------------------------------------------
function updateShip(p, ds, t) {
  if (t - p.keyT < 1500) p.x += ((p.keys.r ? 1 : 0) - (p.keys.l ? 1 : 0)) * C.keySpeed * ds;
  else if (p.tx != null) {
    const target = 6 + p.tx * (FW - 12), m = C.maxShipSpeed * ds;
    p.x += clamp((target - p.x) * (1 - Math.exp(-C.follow * ds)), -m, m);
  }
  p.x = clamp(p.x, 4, FW - 4);
  p.invuln = Math.max(0, p.invuln - ds * 1000);

  // Shield (squat): max shieldMaxMs, then you must stand up and wait the cooldown.
  const wantShield = p.sq.on || p.keys.shield;
  p.shieldCd = Math.max(0, p.shieldCd - ds * 1000);
  if (!wantShield) { if (p.shield) { p.shield = false; p.shieldCd = 300 + p.shieldMs * 0.5; } p.shieldMs = 0; p.shieldBlocked = false; }
  else if (!p.shield && !p.shieldBlocked && p.shieldCd <= 0) { p.shield = true; p.shieldMs = 0; tone(300, 600, 0.15, 'triangle', 0.05); }
  if (p.shield && (p.shieldMs += ds * 1000) >= C.shieldMaxMs) { p.shield = false; p.shieldBlocked = true; p.shieldCd = C.shieldCooldownMs; tone(500, 200, 0.2, 'triangle', 0.04); }

  // Spread shot (arms wide): drains energy; when empty, put your arms down to recharge.
  const wantSpread = p.wide.on || p.keys.spread;
  if (!wantSpread) p.spreadLock = false;
  p.spreading = wantSpread && !p.spreadLock && !p.shield && p.energy > 0;
  if (p.spreading) { p.energy -= C.spreadDrain * ds; if (p.energy <= 0) { p.energy = 0; p.spreadLock = true; } }
  else p.energy = Math.min(100, p.energy + C.spreadRecharge * ds);

  if (p.shield) { p.fireAcc = 0; return; }
  p.fireAcc += ds * 1000;
  while (p.fireAcc >= C.fireMs) { p.fireAcc -= C.fireMs; fire(p); }
}
function fire(p) {
  const v = 130;
  if (p.spreading) for (const deg of [-24, -12, 0, 12, 24]) { const a = -Math.PI / 2 + deg * Math.PI / 180; S.pb.push({ x: p.x, y: SHIP_Y - 4, vx: Math.cos(a) * v, vy: Math.sin(a) * v, owner: p }); }
  else for (const dx of [-1.4, 1.4]) S.pb.push({ x: p.x + dx, y: SHIP_Y - 3, vx: 0, vy: -v, owner: p });
  tone(p.i ? 1500 : 1300, 500, 0.05, 'square', 0.008);
}
function bomb(p) {
  if (p.bombs <= 0) { S.texts.push({ x: p.x, y: SHIP_Y - 8, text: 'NO NOVA', color: '#8a8fb3', t: 0 }); tone(200, 100, 0.2, 'square', 0.03); return; }
  p.bombs--; S.flash = 1; S.shake = 1;
  S.rings.push({ x: p.x, y: SHIP_Y, r: 0, color: p.color });
  S.eb = [];
  for (const e of S.enemies) if (e.y > -5) damage(e, e.type === 'boss' ? 25 : 12, p);
  boom(1.2, 0.35, 2500); tone(1200, 60, 0.9, 'sawtooth', 0.05);
  log(`${p.name}: NOVA (${p.bombs} left)`);
}
function hitShip(p) {
  if (p.invuln > 0 || p.shield) return false;
  p.lives--; S.shake = 1; explode(p.x, SHIP_Y, p.color, 50, 40); boom(0.7, 0.35, 900);
  if (p.lives > 0) p.invuln = C.invulnMs;
  else { S.texts.push({ x: p.x, y: SHIP_Y - 10, text: p.name + ' OUT', color: p.color, t: 0, big: true }); log(`${p.name}: out (score ${p.score})`); }
  return true;
}

// --- effects -----------------------------------------------------------------
function explode(x, y, color, n, speed) {
  for (let i = 0; i < n && S.parts.length < 700; i++) {
    const a = rnd(0, 6.283), v = rnd(0.2, 1) * speed;
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.3, 0.9), max: 0.9, color: Math.random() < 0.3 ? '#ffffff' : color, size: rnd(0.4, 1.1) });
  }
}

// --- main update -------------------------------------------------------------
function update(dt, t) {
  const ds = dt / 1000;
  const scroll = S.state === 'playing' ? 1 + 1.5 * intensity() : 0.5;
  for (const s of S.stars) { s.y += (6 + 34 * s.z) * scroll * ds; if (s.y > 100) { s.y -= 100; s.x = Math.random(); } }
  for (const p of S.parts) { p.x += p.vx * ds; p.y += p.vy * ds; p.vx *= 0.96; p.vy *= 0.96; p.life -= ds; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const x of S.texts) x.t += ds;
  S.texts = S.texts.filter(x => x.t < (x.big ? 2 : 0.8));
  for (const r of S.rings) r.r += 160 * ds;
  S.rings = S.rings.filter(r => r.r < FW * 1.2);
  S.flash = Math.max(0, S.flash - ds * 2.5); S.shake = Math.max(0, S.shake - ds * 3);
  for (const p of slots) handsUp(p, t);
  if (S.state === 'over' && t - S.overAt > 12000) { S.state = 'title'; for (const p of slots) p.joined = false; }
  if (S.state !== 'playing') return;

  S.t += dt;
  if (Math.floor(S.t / 60000) > S.minute) { S.minute++; log(`${S.minute} min played (intensity ${Math.round(intensity() * 100)}%, team ${teamScore()})`); }
  const k = intensity(), spd = speedMul(), live = slots.filter(alive);
  let interval = lerp(C.spawnStart, C.spawnEnd, k) / (1 + 0.45 * Math.max(0, live.length - 1));
  if (S.boss) interval /= 0.35;
  S.spawnAcc += ds;
  while (S.spawnAcc >= interval) { S.spawnAcc -= interval; spawnEnemy(k); }
  if (!S.boss && S.t >= S.nextBoss) spawnBoss();

  for (const p of live) updateShip(p, ds, t);
  for (const b of S.pb) { b.x += b.vx * ds; b.y += b.vy * ds; }
  for (const b of S.eb) { b.x += b.vx * ds; b.y += b.vy * ds; }
  for (const e of S.enemies) updateEnemy(e, ds, spd);
  for (const u of S.pickups) { u.y += 16 * ds; u.t += ds; }

  // Collisions
  for (const b of S.pb) for (const e of S.enemies) {
    if (b.hit || e.dead) continue;
    const dx = b.x - e.x, dy = b.y - e.y, rr = e.r + 0.8;
    if (dx * dx + dy * dy < rr * rr) { b.hit = true; damage(e, 1, b.owner); explode(b.x, b.y, e.color, 3, 15); }
  }
  for (const p of live) {
    const sr = p.shield ? 5.5 : 1.8;
    for (const b of S.eb) {
      if (b.hit) continue;
      const dx = b.x - p.x, dy = b.y - SHIP_Y;
      if (dx * dx + dy * dy < (sr + b.r) ** 2) { b.hit = true; if (p.shield) { explode(b.x, b.y, p.color, 4, 12); tone(1800, 900, 0.05, 'triangle', 0.02); } else hitShip(p); }
    }
    for (const e of S.enemies) {
      if (e.dead) continue;
      const dx = e.x - p.x, dy = e.y - SHIP_Y, rr = e.r + (p.shield ? 5.5 : 2.2);
      if (dx * dx + dy * dy >= rr * rr) continue;
      if (p.shield) { if (e.type !== 'boss') damage(e, 99, p); }
      else if (p.invuln <= 0) { hitShip(p); if (e.type !== 'boss') damage(e, 3, null); }
    }
    for (const u of S.pickups) {
      if (u.taken || Math.hypot(u.x - p.x, u.y - SHIP_Y) > 5) continue;
      u.taken = true;
      if (u.kind === 'life') p.lives = Math.min(C.maxLives, p.lives + 1); else p.bombs = Math.min(C.maxBombs, p.bombs + 1);
      S.texts.push({ x: p.x, y: SHIP_Y - 8, text: u.kind === 'life' ? '+1 SHIP' : '+NOVA', color: '#ffd84d', t: 0 });
      tone(660, 1320, 0.2, 'triangle', 0.06);
    }
  }
  S.pb = S.pb.filter(b => !b.hit && b.y > -5 && b.x > -5 && b.x < FW + 5);
  S.eb = S.eb.filter(b => !b.hit && b.y < 105 && b.y > -10 && b.x > -5 && b.x < FW + 5);
  S.enemies = S.enemies.filter(e => !e.dead && e.y < 110 && e.y > -30 && e.x > -15 && e.x < FW + 15);
  S.pickups = S.pickups.filter(u => !u.taken && u.y < 105);

  if (slots.some(p => p.joined) && !slots.some(alive)) { gameOver(); return; }
  // Nobody flying is in view (and no keyboard use): pause until someone raises both hands.
  if (poseReady && live.length && !live.some(p => p.lm || t - p.keyT < 5000)) {
    if ((S.lostMs += dt) > C.lostPauseMs) pause('nobody in view');
  } else S.lostMs = 0;
}

// Both hands above your head, held: start / resume / join / NOVA bomb.
function handsUp(p, t) {
  if (!p.up.on) { p.upStart = null; p.upUsed = false; p.holdFrac = 0; return; }
  p.upStart ??= t;
  if (p.upUsed) { p.holdFrac = 0; return; }
  let need, act;
  if (S.state === 'title' || (S.state === 'over' && t - S.overAt > 1500)) { need = C.startHoldMs; act = () => startGame(p); }
  else if (S.state === 'paused') { need = C.startHoldMs; act = resume; }
  else if (S.state === 'playing' && alive(p)) { need = C.bombHoldMs; act = () => bomb(p); }
  else if (S.state === 'playing' && !p.joined) { need = C.startHoldMs; act = () => join(p); }
  else { p.holdFrac = 0; return; }
  const held = t - p.upStart;
  p.holdFrac = Math.min(1, held / need);
  if (held >= need) { p.upUsed = true; p.holdFrac = 0; act(); }
}

// ---------------------------------------------------------------------------
// Drawing (field units: 100 tall, FW wide)
// ---------------------------------------------------------------------------
let SC = 1, OX = 0;
function resize() {
  cv.width = Math.max(1, innerWidth); cv.height = Math.max(1, innerHeight);   // never 0 (hidden window): FW would be infinite
  SC = cv.height / 100; FW = cv.width / SC; OX = 0;
  for (const p of slots) p.x = clamp(p.x, 4, FW - 4);
}
function poly(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }
function neon(color, fillA = 0.25, w = 0.45) {
  ctx.fillStyle = hexA(color, fillA); ctx.fill();
  ctx.strokeStyle = hexA(color, 0.35); ctx.lineWidth = w * 3.5; ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
}
function text(str, x, y, size, color, align = 'center', weight = 800) {
  ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function drawEnemy(e) {
  const col = e.flash > 0 ? '#ffffff' : e.color, r = e.r;
  ctx.save(); ctx.translate(e.x, e.y);
  switch (e.type) {
    case 'drifter': ctx.rotate(e.t * 2); poly([[0, -r], [r, 0], [0, r], [-r, 0]]); neon(col); break;
    case 'darter': {
      const shake = e.state === 'aim' ? Math.sin(e.t * 60) * 0.4 : 0;
      ctx.rotate(e.state === 'dive' ? Math.atan2(e.vy, e.vx) - Math.PI / 2 : 0); ctx.translate(shake, 0);
      poly([[0, r * 1.3], [r, -r], [0, -r * 0.4], [-r, -r]]); neon(col, e.state === 'aim' ? 0.6 : 0.25); break;
    }
    case 'gunner':
      poly(Array.from({ length: 6 }, (_, i) => [Math.cos(i * Math.PI / 3) * r, Math.sin(i * Math.PI / 3) * r])); neon(col);
      ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, 7); ctx.fillStyle = col; ctx.fill(); break;
    case 'splitter':
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); neon(col, 0.18);
      ctx.beginPath(); ctx.arc(-r * 0.35, 0, r * 0.35, 0, 7); ctx.arc(r * 0.35, 0, r * 0.35, 0, 7); ctx.fillStyle = hexA(col, 0.6); ctx.fill(); break;
    case 'boss': {
      poly([[-r * 1.6, -r * 0.2], [-r * 0.7, -r * 0.8], [r * 0.7, -r * 0.8], [r * 1.6, -r * 0.2], [r, r * 0.6], [r * 0.3, r * 0.4], [0, r * 0.9], [-r * 0.3, r * 0.4], [-r, r * 0.6]]);
      neon(col, 0.22, 0.6);
      const pulse = 0.5 + 0.5 * Math.sin(e.t * 6);
      ctx.beginPath(); ctx.arc(0, 0, r * 0.32, 0, 7); ctx.fillStyle = hexA('#ffd84d', 0.5 + 0.5 * pulse); ctx.fill();
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * r, 0, r * 0.15, 0, 7); ctx.fillStyle = col; ctx.fill(); }
      break;
    }
  }
  ctx.restore();
}
function drawShip(p, t) {
  if (p.invuln > 0 && Math.floor(p.invuln / 110) % 2) return;
  ctx.save(); ctx.translate(p.x, SHIP_Y);
  const fl = 2 + Math.random() * 1.5;
  poly([[-1, 2.4], [0, 2.4 + fl], [1, 2.4]]); ctx.fillStyle = '#ffd84d'; ctx.fill();
  if (p.spreading) { ctx.strokeStyle = hexA('#ffd84d', 0.8); ctx.lineWidth = 0.6; ctx.beginPath(); ctx.moveTo(-6, 1); ctx.lineTo(-2.5, -1); ctx.moveTo(6, 1); ctx.lineTo(2.5, -1); ctx.stroke(); }
  poly([[0, -4.2], [1.3, -1], [3.6, 2.6], [1, 1.6], [0, 2.6], [-1, 1.6], [-3.6, 2.6], [-1.3, -1]]);
  neon(p.color, 0.5, 0.5);
  if (p.shield) {
    const left = 1 - p.shieldMs / C.shieldMaxMs;
    ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, 7); ctx.fillStyle = hexA(p.color, 0.12 + 0.06 * Math.sin(t / 60)); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 5.5, -Math.PI / 2, -Math.PI / 2 + left * 2 * Math.PI); ctx.strokeStyle = p.color; ctx.lineWidth = 0.6; ctx.stroke();
  }
  if (slots.filter(alive).length > 1) text(p.name, 0, 7.5, 2.2, p.color);
  if (p.holdFrac > 0) { ctx.beginPath(); ctx.arc(0, 0, 7, -Math.PI / 2, -Math.PI / 2 + p.holdFrac * 2 * Math.PI); ctx.strokeStyle = '#ffd84d'; ctx.lineWidth = 0.8; ctx.stroke(); }   // NOVA charging
  ctx.restore();
}
function drawHud(t) {
  const pad = 3;
  for (const p of slots) {
    if (!p.joined) continue;
    const right = p.i === 1, x = right ? FW - pad : pad, al = right ? 'right' : 'left', dir = right ? -1 : 1;
    text(p.name, x, 4, 3, p.color, al, 900);
    text(String(p.score), x + dir * 7, 4, 3.4, '#f2f3ff', al, 800);
    if (p.lives <= 0) { text('OUT', x, 8.5, 2.4, '#8a8fb3', al); continue; }
    for (let i = 0; i < p.lives; i++) {
      ctx.save(); ctx.translate(x + dir * (1.8 + i * 3.6), 8.8); ctx.scale(0.45, 0.45);
      poly([[0, -4.2], [3.6, 2.6], [0, 1.2], [-3.6, 2.6]]); ctx.fillStyle = p.color; ctx.fill(); ctx.restore();
    }
    for (let i = 0; i < p.bombs; i++) { ctx.beginPath(); ctx.arc(x + dir * (1.4 + i * 3.2), 13, 1.2, 0, 7); ctx.fillStyle = '#ffd84d'; ctx.fill(); }
    const bw = 14, bx = right ? x - bw : x;
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(bx, 15.6, bw, 0.9);
    ctx.fillStyle = p.spreadLock ? '#ff5f7a' : '#ffd84d'; ctx.fillRect(right ? x - bw * p.energy / 100 : bx, 15.6, bw * p.energy / 100, 0.9);
  }
  if (S.state === 'playing' || S.state === 'paused') {
    const sec = Math.floor(S.t / 1000);
    text(`${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`, FW / 2, 4, 2.6, '#8a8fb3', 'center', 700);
    if (slots.filter(p => p.joined).length > 1) text(`TEAM ${teamScore()}`, FW / 2, 7.5, 2.2, '#f2f3ff', 'center', 700);
  }
  if (S.boss && S.boss.state === 'fight') {
    const w = FW * 0.4, x0 = (FW - w) / 2;
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x0, 10.5, w, 1.2);
    ctx.fillStyle = '#ff5f7a'; ctx.fillRect(x0, 10.5, w * Math.max(0, S.boss.hp / S.boss.maxHp), 1.2);
  }
  // Players in view but not flying: invite them in.
  if (S.state === 'playing') for (const p of slots) if (p.lm && !p.joined) {
    const x = p.i ? FW * 0.75 : FW * 0.25;
    text(`${p.name}: raise both hands & hold to join`, x, 96.5, 2.2, p.color, 'center', 700);
    holdBar(x, 98.4, 20, p.holdFrac, p.color);
  }
}
function holdBar(x, y, w, v, color) {
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(x - w / 2, y, w, 0.9);
  ctx.fillStyle = color; ctx.fillRect(x - w / 2, y, w * v, 0.9);
}
function drawScreens(t) {
  if (S.state === 'playing') return;
  ctx.fillStyle = 'rgba(5,5,11,.62)'; ctx.fillRect(0, 0, FW, 100);
  const cxm = FW / 2;
  if (S.state === 'title') {
    const g = ctx.createLinearGradient(cxm - 40, 0, cxm + 40, 0);
    g.addColorStop(0, '#ff5fa2'); g.addColorStop(0.5, '#ffd84d'); g.addColorStop(1, '#5ce1e6');
    text('STARGUARD', cxm, 22, 13, g, 'center', 900);
    const lines = [
      ['Step left / right', 'fly (the ship follows you)'],
      ['Arms out wide', 'spread shot while you hold it'],
      ['Squat', 'shield (no shooting meanwhile)'],
      ['Both hands up, hold', 'NOVA bomb: clears the screen'],
    ];
    lines.forEach(([a, b], i) => { text(a, cxm - 2, 38 + i * 6, 3, '#ffd84d', 'right', 800); text(b, cxm + 2, 38 + i * 6, 3, '#c9cce6', 'left', 500); });
    text('Raise both hands above your head and hold to start', cxm, 68, 3.6, '#f2f3ff', 'center', 800);
    const inView = slots.filter(p => p.lm);
    text(inView.length ? `${inView.map(p => p.name).join(' + ')} in view${inView.length > 1 ? ': you both play' : ''}` : (camMsg || 'Step in front of the camera'), cxm, 74, 2.6, '#8a8fb3', 'center', 600);
    holdBar(cxm, 78, 40, Math.max(...slots.map(p => p.holdFrac)), '#3cff9e');
    if (best) text(`BEST ${best}`, cxm, 86, 3, '#ffd84d');
  } else if (S.state === 'paused') {
    text('PAUSED', cxm, 40, 9, '#f2f3ff', 'center', 900);
    text('Raise both hands & hold to resume', cxm, 52, 3.4, '#c9cce6', 'center', 600);
    holdBar(cxm, 57, 40, Math.max(...slots.map(p => p.holdFrac)), '#3cff9e');
  } else if (S.state === 'over') {
    text('GAME OVER', cxm, 28, 10, '#ff5f7a', 'center', 900);
    const js = slots.filter(p => p.joined);
    js.forEach((p, i) => text(`${p.name}  ${p.score}`, cxm, 42 + i * 6, 4, p.color, 'center', 800));
    if (js.length > 1) text(`TEAM ${teamScore()}`, cxm, 42 + js.length * 6, 4, '#f2f3ff', 'center', 800);
    text(`BEST ${best} · survived ${Math.floor(S.t / 60000)}:${String(Math.floor(S.t / 1000) % 60).padStart(2, '0')}`, cxm, 62, 3, '#ffd84d', 'center', 700);
    if (t - S.overAt > 1500) { text('Raise both hands & hold to play again', cxm, 72, 3.2, '#c9cce6', 'center', 600); holdBar(cxm, 76, 40, Math.max(...slots.map(p => p.holdFrac)), '#3cff9e'); }
  }
}
const BONES = [[11, 12], [11, 23], [12, 24], [23, 24], [11, 13], [13, 15], [12, 14], [14, 16], [23, 25], [24, 26]];
function drawCam() {
  if (!showCam || video.readyState < 2) return;
  const w = Math.min(340, cv.width * 0.2), h = w * video.videoHeight / video.videoWidth, x0 = cv.width - w - 12, y0 = cv.height - h - 12;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 0.85;
  ctx.save(); ctx.translate(x0, y0);
  if (!swapLR) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0, w, h); ctx.restore();
  ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x0, y0, w, h);
  // the band that maps onto the whole screen
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1;
  for (const v of [C.trackMin, C.trackMax]) { ctx.beginPath(); ctx.moveTo(x0 + v * w, y0); ctx.lineTo(x0 + v * w, y0 + h); ctx.stroke(); }
  ctx.setLineDash([]);
  for (const p of slots) {
    if (!p.lm) continue;
    const X = i => x0 + vx(p.lm[i].x) * w, Y = i => y0 + p.lm[i].y * h, vis = i => (p.lm[i].visibility ?? 1) > 0.4;
    ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const [a, b] of BONES) if (vis(a) && vis(b)) { ctx.beginPath(); ctx.moveTo(X(a), Y(a)); ctx.lineTo(X(b), Y(b)); ctx.stroke(); }
    const col = p.sq.on ? '#5ce1e6' : p.up.on ? '#3cff9e' : p.wide.on ? '#ffd84d' : p.color;
    for (const i of [15, 16]) if (vis(i)) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(X(i), Y(i), 6, 0, 7); ctx.fill(); }
    if (vis(0)) { ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = p.color; ctx.fillText(p.name, X(0), Y(0) - 18); }
  }
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.strokeRect(x0, y0, w, h);
  if (camMsg) { ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#ff8a8a'; ctx.fillText(camMsg, x0 + w / 2, y0 + h / 2); }
  if (debug) {
    ctx.font = '12px ui-monospace, monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#c9cce6';
    slots.forEach((p, i) => {
      const f = p.f;
      ctx.fillText(f ? `${p.name} wide ${f.lx.toFixed(2)}/${f.rx.toFixed(2)} (>${C.wideOn}) up ${f.up ? 'Y' : 'n'} squat ${f.drop.toFixed(2)} (>${C.squatOn})${p.ref == null ? ' calib' : ''}` : `${p.name} -`, x0, y0 - 24 + i * 14);
    });
  }
  ctx.restore();
}
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#05050b'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sh = S.shake * 1.2;
  ctx.setTransform(SC, 0, 0, SC, OX + rnd(-sh, sh) * SC, rnd(-sh, sh) * SC);
  for (const s of S.stars) { const a = 0.25 + 0.6 * s.z; ctx.fillStyle = `rgba(200,210,255,${a})`; const sz = 0.15 + 0.35 * s.z; ctx.fillRect(s.x * FW, s.y, sz, sz * (1 + 2 * s.z * intensity())); }
  for (const r of S.rings) { ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.strokeStyle = hexA(r.color, Math.max(0, 1 - r.r / FW)); ctx.lineWidth = 2; ctx.stroke(); }
  for (const u of S.pickups) {
    ctx.save(); ctx.translate(u.x, u.y); ctx.rotate(u.t * 2);
    poly([[0, -2.4], [2.4, 0], [0, 2.4], [-2.4, 0]]); neon(u.kind === 'life' ? '#3cff9e' : '#ffd84d', 0.4, 0.4); ctx.restore();
    text(u.kind === 'life' ? '+' : 'N', u.x, u.y + 0.1, 2.4, '#05050b', 'center', 900);
  }
  for (const e of S.enemies) drawEnemy(e);
  ctx.lineCap = 'round';
  for (const b of S.pb) { ctx.strokeStyle = b.owner.color; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.018, b.y - b.vy * 0.018); ctx.stroke(); }
  for (const b of S.eb) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fillStyle = '#ff5f7a'; ctx.fill(); ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, 7); ctx.fillStyle = '#ffe0e6'; ctx.fill(); }
  for (const p of slots) if (alive(p) && S.state !== 'title') drawShip(p, t);
  for (const p of S.parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  for (const x of S.texts) { ctx.globalAlpha = 1 - x.t / (x.big ? 2 : 0.8); text(x.text, x.x, x.y - x.t * 6, x.big ? 4.5 : 2.4, x.color, 'center', 900); }
  ctx.globalAlpha = 1;
  ctx.setTransform(SC, 0, 0, SC, OX, 0);
  drawHud(t);
  drawScreens(t);
  if (S.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${S.flash * 0.5})`; ctx.fillRect(0, 0, FW, 100); }
  drawCam();
}

// ---------------------------------------------------------------------------
// Keyboard: P1 A/D fly · W spread · S shield · E nova — P2 ←/→ · ↑ · ↓ · /
//           Enter start/resume · P pause · F fullscreen · N music · +/− volume · V camera · M mirror · B debug
// ---------------------------------------------------------------------------
const KEYMAP = {
  a: [0, 'l'], d: [0, 'r'], w: [0, 'spread'], s: [0, 'shield'], e: [0, 'bomb'],
  ArrowLeft: [1, 'l'], ArrowRight: [1, 'r'], ArrowUp: [1, 'spread'], ArrowDown: [1, 'shield'], '/': [1, 'bomb'],
};
addEventListener('keydown', ev => {
  unlockAudio();
  const k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key, m = KEYMAP[k];
  if (m) {
    ev.preventDefault();
    const p = slots[m[0]]; p.keyT = now();
    if (S.state === 'playing' && !p.joined) join(p);
    if (m[1] === 'bomb') { if (!ev.repeat && S.state === 'playing' && alive(p)) bomb(p); }
    else p.keys[m[1]] = true;
    return;
  }
  if (ev.repeat) return;
  if (k === 'Enter') { if (S.state === 'paused') resume(); else if (S.state !== 'playing') { slots[0].keyT = now(); startGame(slots[0]); } }
  else if (k === 'p') S.state === 'paused' ? resume() : pause('key');
  else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === 'n') { musicOn = !musicOn; log(`Music ${musicOn ? 'on' : 'off'}`); }
  else if (k === '+' || k === '=') { C.musicVolume = Math.min(2, C.musicVolume + 0.1); log(`Music volume ${Math.round(C.musicVolume * 100)}%`); }
  else if (k === '-') { C.musicVolume = Math.max(0, C.musicVolume - 0.1); log(`Music volume ${Math.round(C.musicVolume * 100)}%`); }
  else if (k === 'v') showCam = !showCam;
  else if (k === 'm') { swapLR = !swapLR; log(`Mirror ${swapLR ? 'off' : 'on'}`); }
  else if (k === 'b') { debug = !debug; log(`Gesture debug ${debug ? 'on' : 'off'}`); }
});
addEventListener('keyup', ev => {
  const k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key, m = KEYMAP[k];
  if (m && m[1] !== 'bomb') slots[m[0]].keys[m[1]] = false;
});
addEventListener('pointerdown', unlockAudio);
addEventListener('resize', resize);

let last = performance.now(), fps = { n: 0, since: performance.now() };
function frame(t) {
  requestAnimationFrame(frame);
  if (t - last < 1000 / C.maxFps - 2) return;
  if (cv.width !== Math.max(1, innerWidth) || cv.height !== Math.max(1, innerHeight)) resize();
  const dt = Math.min(50, t - last); last = t;
  pollPose(t);
  update(dt, t);
  draw(t);
  fps.n++;
  if (t - fps.since > 15000) { log(`perf: ${(fps.n * 1000 / (t - fps.since)).toFixed(0)} fps, ${S.enemies.length} enemies, ${S.parts.length} particles`); fps.n = 0; fps.since = t; }
}
resize();
unlockAudio();
setTimeout(() => log(soundOn() ? 'Sound: on' : 'Sound is OFF until you press a key or click (or start with ./start.sh 8000 starguard.html)'), 500);
setInterval(musicTick, 30);
requestAnimationFrame(frame);
initCamera();
</script>
